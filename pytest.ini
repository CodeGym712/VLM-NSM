[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers --tb=short

markers =
    unit: Pure Python unit tests, no external dependencies (fast, runs anywhere)
    symbolic: Symbolic reasoning tests (predicates, alignment, PDDL, planning, BFS, verifier, state machines) — no MuJoCo/GPU
    sim: Tests that require robosuite/MuJoCo simulation environment
    vision: Tests that require OpenCV, PIL, or YOLO/ultralytics
    gpu: Tests that require PyTorch with GPU (CUDA)
    vlm: Tests that call the Qwen/DashScope VLM API (needs QWEN_API_KEY)
    slow: Tests that take >10 seconds
    integration: Tests spanning multiple subsystems
